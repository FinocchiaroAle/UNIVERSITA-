name: Deploy sito Programmazione I su GitHub Pages
# URL pubblico: https://finocchiaroale.github.io/UNIVERSITA-/

on:
  push:
    branches:
      - main
    paths:
      - "1° SEMESTRE/programmazione-1/sito/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (1° SEMESTRE/programmazione-1/sito)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "1° SEMESTRE/programmazione-1/sito"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
