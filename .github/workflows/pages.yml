name: Deploy siti corsi su GitHub Pages
# URL pubblici:
#   - Programmazione I: https://finocchiaroale.github.io/UNIVERSITA-/
#   - Algebra Lineare:  https://finocchiaroale.github.io/UNIVERSITA-/algebra-lineare/

on:
  push:
    branches:
      - main
    paths:
      - "1° SEMESTRE/programmazione-1/sito/**"
      - "1° SEMESTRE/algebra-lineare/sito/**"
      - "1° SEMESTRE/algebra-lineare/dispensa_algebra_lineare.pdf"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble GitHub Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site/algebra-lineare
          cp -r "1° SEMESTRE/programmazione-1/sito/." _site/
          cp -r "1° SEMESTRE/algebra-lineare/sito/." _site/algebra-lineare/
          cp "1° SEMESTRE/algebra-lineare/dispensa_algebra_lineare.pdf" _site/dispensa_algebra_lineare.pdf
          touch _site/.nojekyll

      - name: Upload artifact (_site)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
